  try{ if(window.ULAB) ULAB.ev("topic_finish_card",{next:nx||""}); }catch(e){}
}

/* ---------- 主題頁：偵測搞亂資料、測驗完成、小助教 ---------- */
if(TOPICS.indexOf(TOPIC)>=0){
  var cur=window.STT_STATION||"";
  window.addEventListener("stt-station",function(e){ cur=e.detail; setTimeout(check,50); if(cur==="next") setTimeout(finishCard,700); });
  if(cur==="next") setTimeout(finishCard,1200);
  // 搞亂資料：在 ⑥ 那一站按頁面裡的按鈕（導覽、小助教不算）；資料視覺化 ⑤⑥ 同一段 → 看是不是點在紅框 .chaosbar 裡
  document.addEventListener("click",function(e){
    var b=e.target.closest && e.target.closest("button,input[type=range],input[type=checkbox],select,[role=button]");
    // 注意：分頁導覽.js 會在 <body> 加 class="pg-on"，pg- 開頭的規則不能算到 body，不然整頁都被略過（2026-11-11 修：迴歸、視覺化搞亂成就拿不到）
    if(!b || b.closest("nav,header,footer,.stt,.stt-fab,#stationnav,:not(body):not(html)[class^='pg-'],:not(body):not(html)[class*=' pg-'],.ach-toast,.fin-wrap")) return;
    var inChaos = TOPIC==="vz" ? !!b.closest(".chaosbar") : cur==="chaos";
    if(!inChaos) return;
    S=load(); S.chaos=S.chaos||{}; S.chaos[TOPIC]=(S.chaos[TOPIC]||0)+1; save(S);
    if(S.chaos[TOPIC]>=3) unlock(TOPIC+"_chaos");
    check();
  },true);
  // 測驗完成：各主題結果畫面出現的樣子不同，每 2 秒看一次（很省）
  var DONE={
    reg:function(){ var v=document.getElementById("vResult"); return v && !v.hidden && v.children.length; },
    km:function(){ return document.querySelector("#cat-app h2.cat-h"); },
    dt:function(){ return document.querySelector("#cat-root #to-diag"); },
    vz:function(){ var a=document.getElementById("qDone"), b=document.getElementById("pDone");
      return (a && a.style.display==="block") || (b && b.style.display==="block"); }
  };
  setInterval(function(){ if(!(load().got||{})[TOPIC+"_quiz"] && DONE[TOPIC]()) unlock(TOPIC+"_quiz"); }, 2000);
}
// 小助教：數「我問的」訊息（每一頁都有小助教，包含選主題頁）
(function watchTutor(n){
  var logEl=document.querySelector(".stt .stt-log");
  if(!logEl){ if(n<20) setTimeout(function(){ watchTutor(n+1); }, 1000); return; }
  new MutationObserver(function(ms){
    var k=0; ms.forEach(function(m){ m.addedNodes.forEach(function(x){ if(x.classList && x.classList.contains("me")) k++; }); });
    if(!k) return; S=load(); S.tutor=(S.tutor||0)+k; save(S); check();
  }).observe(logEl,{childList:true});
})(0);

/* ---------- 選主題頁：徽章牆 ---------- */
function wall(){
  var host=document.querySelector(".flow"); if(!host) return;
  var g=load().got||{}, shown=LIST.filter(function(b){ return !b.hidden; }), eggs=LIST.filter(function(b){ return b.hidden; });
  var n=shown.filter(function(b){ return g[b.id]; }).length, ne=eggs.filter(function(b){ return g[b.id]; }).length;
  var st=document.createElement("style");
  st.textContent=".ach-wall{margin:34px 0 0;border:1.5px solid var(--line);border-radius:18px;background:var(--card);padding:6px 20px}"+
    ".ach-wall summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:14px;padding:12px 0;font-weight:700}"+
    ".ach-wall summary::-webkit-details-marker{display:none}.ach-wall summary .mini{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}"+
    ".ach-wall summary .mini i{width:9px;height:9px;border-radius:50%;background:var(--line)}.ach-wall summary .mini i.on{background:var(--gold)}"+
    ".ach-wall summary .cnt{color:var(--soft);font-weight:500;font-size:14px}.ach-wall summary .cnt b{color:var(--gold)}"+
    ".ach-wall summary .arr{color:var(--faint);font-size:13px;font-weight:500}.ach-wall[open] summary .arr::after{content:'收起'}.ach-wall:not([open]) summary .arr::after{content:'展開'}"+
    ".ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:4px 0 18px}"+
    ".ach-b{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:13.5px;line-height:1.4}"+
    ".ach-b .i{font-size:24px;width:30px;text-align:center}.ach-b b{display:block;font-size:14px}.ach-b span{color:var(--soft)}"+
    ".ach-b.off .i{filter:grayscale(1);opacity:.35}.ach-b.off b{color:var(--faint)}.ach-b.on{border-color:var(--c,var(--gold));background:rgba(255,200,0,.06);background:color-mix(in srgb,var(--c,var(--gold)) 7%,transparent)}"+
    ".ach-b em{display:block;font-style:normal;font-size:12px;color:var(--faint);margin-top:4px}"+
    ".ach-grp{grid-column:1/-1;font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--faint);margin:8px 0 -2px}"+
    ".ach-egg{display:inline;cursor:default;opacity:.55}.ach-egg:hover{opacity:.9}";
  document.head.appendChild(st);
  var d=document.createElement("details"); d.className="ach-wall";
  var h='<summary>🏅 我的成就 <span class="cnt"><b>'+n+'</b> / '+shown.length+'</span><span class="mini" aria-hidden="true">'+
    shown.map(function(b){ return '<i class="'+(g[b.id]?"on":"")+'"></i>'; }).join("")+'</span><span class="arr"></span></summary><div class="ach-grid">';
  TOPICS.concat(["all"]).forEach(function(t){
    h+='<div class="ach-grp">'+(t==="all"?"跨主題":T[t])+'</div>';
    shown.filter(function(b){ return (b.t||"all")===t; }).forEach(function(b){
      h+='<div class="ach-b '+(g[b.id]?"on":"off")+'"'+(b.t?' style="--c:var(--'+b.t+')"':'')+' title="'+(g[b.id]?b.quip:"")+'"><span class="i">'+b.icon+'</span><span><b>'+b.name+'</b><span>'+b.desc+'</span>'+
        (g[b.id]?'<em>「'+b.quip+'」</em>':'')+'</span></div>';
    });
  });
  h+='</div><p style="margin:-6px 0 14px;font-size:12.5px;color:var(--faint)">成就只記在這台電腦的瀏覽器裡，換電腦或清除瀏覽紀錄會重新開始。</p>';
  d.innerHTML=h;
  host.parentNode.insertBefore(d, host.nextSibling);
  if(n && sessionStorageGet("ach_open")) d.open=true;
  d.addEventListener("toggle",function(){ try{ sessionStorage.setItem("ach_open", d.open?"1":""); }catch(e){} });
  // 彩蛋：頁尾一行很淡的字
  var f=document.querySelector("footer");
  if(f){ var s=document.createElement("span"); s.className="ach-egg";
    var found=eggs.filter(function(b){ return g[b.id]; });
    s.textContent="　·　"+(ne?"🥚 "+found.map(function(b){ return b.icon; }).join(" ")+"　彩蛋 "+ne+" / "+eggs.length:"這裡藏著 "+eggs.length+" 顆小彩蛋");
    s.title=ne?found.map(function(b){ return b.name+"："+b.desc; }).join("\n"):"到處逛逛、多回來幾次，也許就會遇到";
    f.appendChild(s); }
}
function sessionStorageGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }

touchDay();
check();
if(TOPIC==="home") wall();
window.ULAB_ACH={list:LIST, state:load, unlock:unlock, check:check};
})();
</script>
<script>window.UANIM_SEL="header, main.topics, p.flow";</script>
<script>/* 換頁動畫（2026-11-15，做上線版.py 注入四個主題頁＋選主題頁）
   ① 同一個主題裡換步驟：往後一步 → 內容從右邊滑進來；往前一步 → 從左邊滑進來（聽各頁本來就會發的 stt-station 事件）
   ② 剛打開頁面：內容輕輕往上浮出來
   ③ 頁面之間（選主題 ⇄ 主題）：瀏覽器內建的跨頁轉場（Chrome／Edge／Safari 18.2+；Firefox 不支援就是一般換頁）
   只動 transform／opacity（顯示卡處理，幾乎不吃效能），動畫結束就把 transform 拿掉，不影響固定在畫面上的按鈕；
   使用者系統有開「減少動態效果」就全部不做。
   window.UANIM_SEL＝這一頁「內容區」的 CSS 選擇器（做上線版.py 依主題設定） */
(function(){
  var reduce=false; try{ reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  var ORDER=["life","guess","story","principle","lab","chaos","myth","quiz","diag","next"];
  var SEL=window.UANIM_SEL||"main";
  var EASE="cubic-bezier(.22,.7,.2,1)";

  // ---- ③ 跨頁轉場：新頁是選主題頁＝「回去」（往右滑），其他＝「往前」（往左滑）
  var css="@view-transition{navigation:auto}"+
    "::view-transition-old(root){animation:uvt-out .32s "+EASE+" both}"+
    "::view-transition-new(root){animation:uvt-in .32s "+EASE+" both}"+
    "html[data-uvt=back]::view-transition-old(root){animation-name:uvt-out-b}"+
    "html[data-uvt=back]::view-transition-new(root){animation-name:uvt-in-b}"+
    "@keyframes uvt-out{to{opacity:0;transform:translateX(-56px)}}@keyframes uvt-in{from{opacity:0;transform:translateX(56px)}}"+
    "@keyframes uvt-out-b{to{opacity:0;transform:translateX(56px)}}@keyframes uvt-in-b{from{opacity:0;transform:translateX(-56px)}}"+
    "@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}}";
  var st=document.createElement("style"); st.textContent=css; document.head.appendChild(st);
  if(window.ULAB_TOPIC==="home") document.documentElement.setAttribute("data-uvt","back");
  window.addEventListener("pagereveal",function(e){ window.__uvtCross=!!e.viewTransition; });

  if(reduce || !Element.prototype.animate) return;

  function targets(){
    var out=[]; document.querySelectorAll(SEL).forEach(function(el){
      if(el.offsetParent!==null || getComputedStyle(el).position==="fixed") out.push(el); });
    return out;
  }
  function play(els, from, ms){
    els.forEach(function(el){
      try{ if(el.__uanim) el.__uanim.cancel(); }catch(e){}
      try{ el.__uanim=el.animate([from,{opacity:1,transform:"none"}],{duration:ms,easing:EASE}); }catch(e){}
    });
  }
  function idx(k){ if(k==null) return -1; var i=ORDER.indexOf(k); return i<0?99:i; }   // 地圖／首頁＝-1，附錄類＝最後面

  // ---- ② 剛打開：輕輕浮上來（有跨頁轉場時就交給它，不重複）
  var cur=window.STT_STATION, t0=Date.now();
  function enter(){
    if(window.__uvtCross) return;
    play(targets(),{opacity:0,transform:"translateY(14px)"},420);
  }

  // ---- ① 換步驟：依前後方向左右滑
  window.addEventListener("stt-station",function(e){
    var k=e.detail;
    if(Date.now()-t0<600){ cur=k; return; }   // 頁面初始化（深連結 #s3 等）發的那一次不滑，交給「剛打開」的浮出
    if(k===cur) return;
    var d=idx(k)>idx(cur)?1:-1; cur=k;
    // 等這一頁真的換好內容（K-means 有 0.18 秒淡出、其他是同步切換）
    requestAnimationFrame(function(){ play(targets(),{opacity:0,transform:"translateX("+(d*44)+"px)"},340); });
  });
  if(window.ULAB_TOPIC==="home" && document.getElementById("u-cover")){}   // 有封面時：封面淡出時才浮出（見封面程式）
  else if(document.readyState==="complete") enter(); else window.addEventListener("load",enter);
  window.UANIM={play:play,targets:targets};
})();
</script>
