*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

header{padding:64px 0 34px}
.brand{font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--soft)}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(32px,6vw,50px);line-height:1.2;margin:10px 0 0}

/* 主題卡 */
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media (max-width:720px){.topics{grid-template-columns:1fr}}
.topic{--c:var(--ink);--lt:var(--line);position:relative;display:flex;flex-direction:column;background:var(--card);
  border:1.5px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;
  transition:transform .18s,border-color .18s,box-shadow .18s}
a.topic:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 12px 28px -16px rgba(0,0,0,.4)}
.topic.reg{--c:var(--reg);--lt:var(--reg-lt)} .topic.km{--c:var(--km);--lt:var(--km-lt)} .topic.dt{--c:var(--dt);--lt:var(--dt-lt)} .topic.vz{--c:var(--vz);--lt:var(--vz-lt)}
.art{background:var(--lt);height:160px;display:grid;place-items:center}
.art svg{width:200px;height:120px}
.body{padding:22px 24px 22px;display:flex;flex-direction:column;flex:1}
.method{font-family:var(--serif);font-weight:900;font-size:clamp(30px,4.2vw,38px);line-height:1.15;color:var(--c);margin:0;letter-spacing:.01em}
.q{margin:10px 0 20px;font-size:17px;color:var(--soft)}
.go{margin-top:auto;font-weight:700;color:var(--c)}
.last{position:absolute;top:14px;right:14px;background:var(--card);color:var(--c);border:1.5px solid var(--c);
  font-size:12px;font-weight:700;border-radius:99px;padding:1px 10px}
.order{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--c)}
.order i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:var(--card);font-size:14px}
.rec{margin:12px 0 0;font-size:16px;color:var(--soft)}
.rec b{color:var(--ink)}
/* 各主題走到第幾步（上線版各頁的 共用追蹤.js 寫進 localStorage "ulab_progress"） */
.prog{display:flex;align-items:center;gap:10px;margin:-8px 0 16px;font-size:13px;color:var(--soft)}
.prog .bar{flex:1;height:6px;border-radius:99px;background:var(--lt);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.prog b{color:var(--c)}
.topic.soon{border-style:dashed;background:transparent}
.topic.soon .art{background:transparent;border-bottom:1.5px dashed var(--line)}
.topic.soon .method,.topic.soon .go{color:var(--faint)}

/* 十步：一行 */
.flow{margin:40px 0 0;font-size:14px;color:var(--faint);line-height:2}
.flow b{color:var(--soft);font-weight:700;margin-right:6px}
.flow span+span::before{content:"→";margin:0 7px;opacity:.6}

footer{margin:36px 0 0;padding:18px 0 40px;border-top:1px solid var(--line);font-size:13px;color:var(--faint)}
@media (max-width:560px){header{padding:40px 0 24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
// 記住上次點了哪個主題（只存在這台瀏覽器；讀寫失敗就略過）
(function(){
  var last=null; try{last=localStorage.getItem("lab_last_topic");}catch(e){}
  document.querySelectorAll(".topic[data-t]").forEach(function(c){
    if(c.dataset.t===last){var s=document.createElement("span");s.className="last";s.textContent="上次學到這裡";c.appendChild(s);}
    c.addEventListener("click",function(){try{localStorage.setItem("lab_last_topic",c.dataset.t);}catch(e){}});
  });
  // 每張卡顯示「已走 n / 10 步」；還沒開始的主題不顯示
  var prog={}; try{prog=JSON.parse(localStorage.getItem("ulab_progress"))||{};}catch(e){}
  var STEPS=["life","guess","story","principle","lab","chaos","myth","quiz","diag","next"];
  document.querySelectorAll(".topic[data-t]").forEach(function(c){
    var p=prog[c.dataset.t]; if(!p) return;
    var n=STEPS.filter(function(s){return p[s];}).length; if(!n) return;
    var d=document.createElement("div"); d.className="prog";
    d.innerHTML='<span class="bar"><i style="width:'+(n*10)+'%"></i></span><span>'+(n>=10?'<b>十步都走過了 ✓</b>':'已走 <b>'+n+'</b> / 10 步')+'</span>';
    var go=c.querySelector(".go"); go.parentNode.insertBefore(d,go);
    go.textContent = n<10 ? "繼續學 →" : "再複習一次 →";
  });
})();
</script>

];

    AC=AC||new C(); if(AC.state==="suspended") AC.resume();
    var t=AC.currentTime+0.02, notes=egg?[784,1175,1568]:[988,1319];   // 彩蛋多一個音

      g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.13,s+0.015); g.gain.exponentialRampToValueAtTime(0.0001,s+0.32);
      o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s+0.35);
    });
  }catch(e){}
}
// 瀏覽器規定要先有點擊才能出聲 → 第一次點擊時先把音效準備好

var css=document.createElement("style");

/* ---------- 判斷 ---------- */
function check(){
  S=load(); S.got=S.got||{};
  var p=prog(), g=S.got;
  TOPICS.forEach(function(t){
    var q=p[t]||{};
    if(STEPS.every(function(s){ return q[s]; })) unlock(t+"_steps");
  });
  if(TOPICS.every(function(t){ var q=p[t]; return q && Object.keys(q).length; })) unlock("all_open");
  if(TOPICS.every(function(t){ return g[t+"_quiz"]; })) unlock("all_quiz");
  if(TOPICS.every(function(t){ return g[t+"_steps"]; })) unlock("all_steps");
  var d=S.days||{}, td=today();
  if(TOPICS.filter(function(t){ return (d[t]||[]).indexOf(td)>=0; }).length>=2) unlock("two_day");
  var all={}; Object.keys(d).forEach(function(k){ (d[k]||[]).forEach(function(x){ all[x]=1; }); });
  if(Object.keys(all).length>=2) unlock("egg_back");
  var c=0; Object.keys(S.chaos||{}).forEach(function(k){ c+=S.chaos[k]; }); if(c>=30) unlock("egg_chaos");
  if((S.tutor||0)>=5) unlock("egg_tutor");
}
function touchDay(){
  S=load(); S.days=S.days||{};
  var k=TOPICS.indexOf(TOPIC)>=0?TOPIC:"home", d=S.days[k]=S.days[k]||[], td=today();
  if(d.indexOf(td)<0){ d.push(td); S.days[k]=d.slice(-30); save(S); }
  var h=new Date().getHours(); if(h>=0 && h<5) unlock("egg_owl");
}

/* ---------- 走到 ⑩ 時：大大的「完成了！」框，選回選主題或下一個主題 ---------- */
var FILE={reg:"regression.html", km:"kmeans.html", dt:"tree.html", vz:"road.html"};
var ICON={reg:"📈", km:"🎯", dt:"🌳", vz:"📊"};
var doneShown=false;
function finishCard(){
  if(doneShown || document.querySelector(".fin-wrap")) return;
  var p=prog(), q=p[TOPIC]||{};
  if(!STEPS.every(function(s){ return q[s]; })) return;
  doneShown=true;
  var left=TOPICS.filter(function(t){ var x=p[t]||{}; return t!==TOPIC && !STEPS.every(function(s){ return x[s]; }); });
  var st=document.createElement("style");
  // 舊 iPhone（iOS 14.4 以前不支援 inset、Safari 18 以前 backdrop-filter 要加 -webkit-）→ 都寫兩份
  st.textContent=".fin-wrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147482000;display:grid;place-items:center;padding:16px;background:rgba(20,24,30,.55);"+
    "-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);-webkit-overflow-scrolling:touch;opacity:0;transition:opacity .3s;font:400 15px/1.6 'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif}"+
    ".fin-wrap.on{opacity:1}.fin{position:relative;width:min(460px,100%);background:#fffdf8;color:#1f2328;border-radius:22px;padding:30px 26px 22px;text-align:center;"+

    ".fin-wrap.on .fin{transform:none}.fin .big{font-size:54px;line-height:1;margin-bottom:8px}.fin h2{margin:0 0 6px;font-size:24px;font-weight:800;color:var(--fc)}"+
    ".fin-prog{margin:4px 0 14px}.fin-icons{display:flex;justify-content:center;gap:10px}"+
    ".fin-icons span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#eee;filter:grayscale(1);opacity:.45}"+
    ".fin-icons span.ok{filter:none;opacity:1;background:#fff;background:color-mix(in srgb,var(--tc) 16%,#fff);box-shadow:0 0 0 2px var(--tc)}"+   // 舊 iOS 不懂 color-mix → 退回白底
    ".fin-cnt{margin-top:8px;font-size:14px;color:#5b6168}.fin-cnt b{color:var(--fc);font-size:17px}"+
    ".fin p{margin:0 0 20px;color:#5b6168}.fin .btns{display:grid;gap:10px}"+
    ".fin a{display:block;padding:14px 16px;border-radius:14px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .15s,filter .15s}"+
    ".fin a:hover{transform:translateY(-2px);filter:brightness(1.05)}.fin a.go{background:var(--nc);color:#fff;box-shadow:0 8px 18px -8px var(--nc)}"+
    ".fin a.home{background:#efe9dc;color:#1f2328}.fin .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:22px;color:#9aa0a6;cursor:pointer;padding:4px 8px}"+

  TOPICS.concat(["all"]).forEach(function(t){
    h+='<div class="ach-grp">'+(t==="all"?"跨主題":T[t])+'</div>';
    shown.filter(function(b){ return (b.t||"all")===t; }).forEach(function(b){
      h+='<div class="ach-b '+(g[b.id]?"on":"off")+'"'+(b.t?' style="--c:var(--'+b.t+')"':'')+' title="'+(g[b.id]?b.quip:"")+'"><span class="i">'+b.icon+'</span><span><b>'+b.name+'</b><span>'+b.desc+'</span>'+

function sessionStorageGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }

touchDay();
check();
if(TOPIC==="home") wall();
window.ULAB_ACH={list:LIST, state:load, unlock:unlock, check:check};
})();
